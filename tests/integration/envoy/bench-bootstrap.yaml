# Envoy bootstrap for the inline-vs-sidecar EPP overhead A/B (BACKLOG §20.2 P1.4).
#
# Two listeners share one backend cluster so the per-request OVERHEAD of the
# ext_proc hop is isolated:
#   - :10000  "plain"  — arm B: HCM -> router -> backend (no ext_proc)
#   - :10001  "eppp"   — arm C: HCM -> ext_proc(Ranvier EPP) -> router -> backend
# Delta (arm C - arm B) = the ext_proc round-trip + EPP decision cost; the
# shared backend + identical HCM/route cancel out.
#
# Phase-1 simplification (see docs/benchmarks/inline-vs-sidecar-ab-scope.md):
# with a SINGLE backend the ext_proc filter still makes the full Process call
# every request (so the overhead is measured), but Envoy routes statically to
# the one backend rather than honoring x-gateway-destination-endpoint. Dynamic
# header-driven multi-backend routing is the realism-phase extension.
#
# Cluster endpoints use compose service DNS (STRICT_DNS): "mock-backend" and
# "ranvier". Verified against the Envoy ext_proc v3 filter API; UNVERIFIED here
# (no Envoy in the sandbox) — expect to iterate this on the Docker host.

admin:
  address:
    socket_address: { address: 0.0.0.0, port_value: 9901 }

static_resources:
  listeners:
    # ----- Arm B: plain proxy -----
    - name: plain
      address:
        socket_address: { address: 0.0.0.0, port_value: 10000 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: plain
                route_config:
                  name: local
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster, timeout: 300s }
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

    # ----- Arm C: ext_proc (Ranvier EPP) then proxy -----
    - name: eppp
      address:
        socket_address: { address: 0.0.0.0, port_value: 10001 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: eppp
                route_config:
                  name: local
                  virtual_hosts:
                    - name: backend
                      domains: ["*"]
                      routes:
                        - match: { prefix: "/" }
                          route: { cluster: backend_cluster, timeout: 300s }
                http_filters:
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      failure_mode_allow: false
                      grpc_service:
                        envoy_grpc: { cluster_name: ext_proc_cluster }
                      processing_mode:
                        request_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_header_mode: SKIP
                        response_body_mode: NONE
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: backend_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: backend_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: mock-backend, port_value: 8000 }

    - name: ext_proc_cluster
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      # gRPC -> HTTP/2 to the Ranvier EPP.
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: ext_proc_cluster
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: ranvier, port_value: 9002 }
