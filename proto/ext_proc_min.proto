// Minimal, wire-compatible subset of Envoy's external processing API used by
// the Gateway API Inference Extension (GIE) Endpoint-Picker (EPP) protocol.
//
// WHY A MINIMAL VENDORED PROTO (not the full Envoy tree):
//   gRPC dispatches on the fully-qualified service+method path
//   (/envoy.service.ext_proc.v3.ExternalProcessor/Process) and protobuf encodes
//   messages by FIELD NUMBER, not by type name — sub-message type names and
//   packages are invisible on the wire. So a GIE-conformant gateway interoperates
//   with this file as long as (a) the package + service + method names match and
//   (b) every field we read/write has the upstream field number and type. The
//   handful of cross-package Envoy types we touch (HeaderMap / HeaderValue /
//   HeaderValueOption / HttpStatus) are therefore INLINED here with their
//   upstream field numbers instead of vendoring envoy/config/core, envoy/type,
//   xds, udpa, validate, googleapis … (a large, churning transitive tree).
//
//   Protobuf ignores unknown fields, so the gateway's full ProcessingRequest
//   (metadata, attributes, trailers, protocol_config, …) decodes cleanly into
//   this subset, and our responses carry only the fields we set.
//
// FIELD NUMBERS VERIFIED (2026-06) against envoyproxy/envoy@main:
//   api/envoy/service/ext_proc/v3/external_processor.proto
//   api/envoy/config/core/v3/base.proto
//   api/envoy/type/v3/http_status.proto
// If you bump the pinned Envoy version, re-verify these numbers.
//
// SCOPE (PR-1, BACKLOG §20.2 P1.4): request_headers in → header-mutation /
// immediate-response out. request_body / dynamic_metadata / trailers are
// declared (forward-looking) but body tokenization + dynamic_metadata land in
// PR-2.

syntax = "proto3";

package envoy.service.ext_proc.v3;

// The external processing service. A GIE-conformant gateway opens one bidi
// stream per request and the picker returns the chosen backend.
service ExternalProcessor {
  rpc Process(stream ProcessingRequest) returns (stream ProcessingResponse) {
  }
}

message ProcessingRequest {
  reserved 1;  // async_mode (removed upstream)
  oneof request {
    HttpHeaders request_headers = 2;
    HttpHeaders response_headers = 3;
    HttpBody request_body = 4;
    HttpBody response_body = 5;
  }
}

message ProcessingResponse {
  oneof response {
    HeadersResponse request_headers = 1;
    HeadersResponse response_headers = 2;
    BodyResponse request_body = 3;
    BodyResponse response_body = 4;
    ImmediateResponse immediate_response = 7;
  }
  // GIE allows the chosen endpoint to be carried in dynamic_metadata under the
  // "envoy.lb" namespace in addition to the header. Typed google.protobuf.Struct
  // upstream; inlined below (wire-compatible) to avoid importing struct.proto.
  Struct dynamic_metadata = 8;
}

message HttpHeaders {
  HeaderMap headers = 1;
  bool end_of_stream = 3;
}

message HttpBody {
  bytes body = 1;
  bool end_of_stream = 2;
}

message HeadersResponse {
  CommonResponse response = 1;
}

message BodyResponse {
  CommonResponse response = 1;
}

message CommonResponse {
  enum ResponseStatus {
    CONTINUE = 0;
    CONTINUE_AND_REPLACE = 1;
  }
  ResponseStatus status = 1;
  HeaderMutation header_mutation = 2;
  bool clear_route_cache = 5;
}

message HeaderMutation {
  repeated HeaderValueOption set_headers = 1;
  repeated string remove_headers = 2;
}

message ImmediateResponse {
  HttpStatus status = 1;
  HeaderMutation headers = 2;
  bytes body = 3;
  string details = 5;
}

// ---- Inlined subset of envoy.config.core.v3 (wire-compatible) ----

message HeaderMap {
  repeated HeaderValue headers = 1;
}

message HeaderValue {
  string key = 1;
  string value = 2;
  bytes raw_value = 3;
}

message HeaderValueOption {
  enum HeaderAppendAction {
    APPEND_IF_EXISTS_OR_ADD = 0;
    ADD_IF_ABSENT = 1;
    OVERWRITE_IF_EXISTS_OR_ADD = 2;
    OVERWRITE_IF_EXISTS = 3;
  }
  HeaderValue header = 1;
  HeaderAppendAction append_action = 3;
  bool keep_empty_value = 4;
}

// ---- Inlined subset of envoy.type.v3 (wire-compatible) ----

message HttpStatus {
  StatusCode code = 1;
}

enum StatusCode {
  Empty = 0;
  OK = 200;
  TooManyRequests = 429;
  ServiceUnavailable = 503;
}

// ---- Inlined subset of google.protobuf.Struct/Value (wire-compatible) ----
//
// dynamic_metadata is google.protobuf.Struct upstream. Inlining a minimal,
// field-number-exact subset (only the Value kinds we emit: string_value=3,
// struct_value=5) keeps the build free of a struct.proto import + the protobuf
// well-known-types include path, while remaining wire-identical: a message
// field is length-delimited bytes, a proto3 map is repeated key=1/value=2
// entries, and the gateway decodes our bytes back into google.protobuf.Struct.
message Struct {
  map<string, Value> fields = 1;
}

message Value {
  oneof kind {
    string string_value = 3;
    Struct struct_value = 5;
  }
}
